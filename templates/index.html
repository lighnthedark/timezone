<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yonder — Time to Travel</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            color: white;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            font-size: 2.5rem;
            margin-bottom: 10px;
            background: linear-gradient(90deg, #00d4ff, #7b2cbf);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            text-align: center;
            color: #888;
            margin-bottom: 40px;
        }

        .hero-mark {
            max-width: 420px;
            margin: 0 auto 10px;
        }

        .city-selectors {
            display: flex;
            justify-content: center;
            gap: 40px;
            margin-bottom: 40px;
            flex-wrap: wrap;
        }

        .selector-group {
            text-align: center;
        }

        .selector-group label {
            display: block;
            margin-bottom: 10px;
            color: #00d4ff;
            font-weight: bold;
        }

        select {
            padding: 15px 30px;
            font-size: 1.1rem;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.1);
            color: white;
            cursor: pointer;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        select option {
            background: #1a1a2e;
            color: white;
        }

        .clocks-container {
            display: flex;
            justify-content: center;
            gap: 60px;
            margin-bottom: 50px;
            flex-wrap: wrap;
        }

        .clock-card {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 20px;
            padding: 40px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.1);
            min-width: 300px;
            transition: transform 0.3s;
        }

        .clock-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 20px 40px rgba(0, 212, 255, 0.2);
        }

        .clock-card.day {
            background: linear-gradient(180deg, rgba(255, 200, 100, 0.1) 0%, rgba(255, 150, 50, 0.05) 100%);
        }

        .clock-card.night {
            background: linear-gradient(180deg, rgba(50, 50, 100, 0.3) 0%, rgba(20, 20, 50, 0.2) 100%);
        }

        .city-name {
            font-size: 1.5rem;
            margin-bottom: 20px;
            color: #00d4ff;
        }

        .time-display {
            font-size: 3.5rem;
            font-weight: bold;
            margin-bottom: 10px;
            font-family: 'Courier New', monospace;
            text-shadow: 0 0 20px rgba(0, 212, 255, 0.5);
        }

        .date-display {
            color: #888;
            font-size: 1.1rem;
            margin-bottom: 15px;
        }

        .day-night-icon {
            font-size: 3rem;
            margin-bottom: 15px;
        }

        .weather-display {
            margin-top: 15px;
            padding: 15px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
        }

        .weather-emoji {
            font-size: 2.5rem;
        }

        .weather-temp {
            font-size: 1.8rem;
            font-weight: bold;
            color: #00d4ff;
        }

        .weather-desc {
            color: #888;
            font-size: 0.9rem;
        }

        .currency-section {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 20px;
            padding: 40px;
            max-width: 500px;
            margin: 0 auto;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .currency-section h2 {
            text-align: center;
            margin-bottom: 30px;
            color: #7b2cbf;
        }

        .currency-input-group {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .currency-input {
            padding: 15px 20px;
            font-size: 1.5rem;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.1);
            color: white;
            width: 150px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .currency-label {
            font-size: 1.2rem;
            color: #00d4ff;
            font-weight: bold;
        }

        .convert-btn {
            display: block;
            width: 100%;
            padding: 15px;
            font-size: 1.2rem;
            border: none;
            border-radius: 10px;
            background: linear-gradient(90deg, #00d4ff, #7b2cbf);
            color: white;
            cursor: pointer;
            margin-top: 20px;
        }

        .convert-btn:hover {
            transform: scale(1.02);
            box-shadow: 0 10px 30px rgba(123, 44, 191, 0.4);
        }

        .result {
            text-align: center;
            margin-top: 30px;
            padding: 20px;
            background: rgba(0, 212, 255, 0.1);
            border-radius: 10px;
            display: none;
        }

        .result.show {
            display: block;
        }

        .converted-amount {
            font-size: 2.5rem;
            font-weight: bold;
            color: #00d4ff;
        }

        .exchange-rate {
            color: #888;
            margin-top: 10px;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="hero-mark" id="yonderHero"></div>
    <p class="subtitle">Compare times, weather, and currency between cities</p>

        <div class="city-selectors">
            <div class="selector-group">
                <label>From City</label>
                <select id="city1">
                    {% for city in cities %}
                    <option value="{{ city }}" {% if city=='Austin, USA' %}selected{% endif %}>{{ city }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="selector-group">
                <label>To City</label>
                <select id="city2">
                    {% for city in cities %}
                    <option value="{{ city }}" {% if city=='Palermo, Sicily' %}selected{% endif %}>{{ city }}</option>
                    {% endfor %}
                </select>
            </div>
        </div>

        <div class="clocks-container">
            <div class="clock-card" id="clock1">
                <div class="day-night-icon" id="icon1">🌞</div>
                <div class="city-name" id="cityName1">Austin, USA</div>
                <div class="time-display" id="time1">--:--:-- --</div>
                <div class="date-display" id="date1">Loading...</div>
                <div class="weather-display">
                    <div class="weather-emoji" id="weatherEmoji1">🌤️</div>
                    <div class="weather-temp" id="weatherTemp1">--°F / --°C</div>
                    <div class="weather-desc" id="weatherDesc1">Loading...</div>
                </div>
            </div>
            <div class="clock-card" id="clock2">
                <div class="day-night-icon" id="icon2">🌙</div>
                <div class="city-name" id="cityName2">Palermo, Sicily</div>
                <div class="time-display" id="time2">--:--:-- --</div>
                <div class="date-display" id="date2">Loading...</div>
                <div class="weather-display">
                    <div class="weather-emoji" id="weatherEmoji2">🌤️</div>
                    <div class="weather-temp" id="weatherTemp2">--°F / --°C</div>
                    <div class="weather-desc" id="weatherDesc2">Loading...</div>
                </div>
            </div>
        </div>

        <div class="currency-section">
            <h2>💱 Currency Converter</h2>
            <div class="currency-input-group">
                <input type="number" id="amount" class="currency-input" value="100" min="0">
                <span class="currency-label" id="fromCurrency">USD</span>
                <span style="font-size: 1.5rem;">→</span>
                <span class="currency-label" id="toCurrency">EUR</span>
            </div>
            <button class="convert-btn" onclick="convertCurrency()">Convert Currency</button>
            <div class="result" id="result">
                <div class="converted-amount" id="convertedAmount">€85.00</div>
                <div class="exchange-rate" id="exchangeRate">1 USD = 0.85 EUR</div>
            </div>
        </div>
    </div>

    <script>
        const city1Select = document.getElementById('city1');
        const city2Select = document.getElementById('city2');

        function updateTimes() {
            fetch('/get_time', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ city1: city1Select.value, city2: city2Select.value })
            })
                .then(response => response.json())
                .then(data => {
                    document.getElementById('cityName1').textContent = data.city1.name;
                    document.getElementById('time1').textContent = data.city1.time;
                    document.getElementById('date1').textContent = data.city1.date;
                    document.getElementById('cityName2').textContent = data.city2.name;
                    document.getElementById('time2').textContent = data.city2.time;
                    document.getElementById('date2').textContent = data.city2.date;

                    const clock1 = document.getElementById('clock1');
                    const clock2 = document.getElementById('clock2');
                    const icon1 = document.getElementById('icon1');
                    const icon2 = document.getElementById('icon2');

                    if (data.city1.hour >= 6 && data.city1.hour < 18) {
                        icon1.textContent = '🌞'; clock1.className = 'clock-card day';
                    } else {
                        icon1.textContent = '🌙'; clock1.className = 'clock-card night';
                    }
                    if (data.city2.hour >= 6 && data.city2.hour < 18) {
                        icon2.textContent = '🌞'; clock2.className = 'clock-card day';
                    } else {
                        icon2.textContent = '🌙'; clock2.className = 'clock-card night';
                    }
                });
        }

        function updateWeather() {
            fetch('/get_weather', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ city1: city1Select.value, city2: city2Select.value })
            })
                .then(response => response.json())
                .then(data => {
                    document.getElementById('weatherEmoji1').textContent = data.city1.emoji;
                    document.getElementById('weatherTemp1').textContent = data.city1.temp_f + '°F / ' + data.city1.temp_c + '°C';
                    document.getElementById('weatherDesc1').textContent = data.city1.description;

                    document.getElementById('weatherEmoji2').textContent = data.city2.emoji;
                    document.getElementById('weatherTemp2').textContent = data.city2.temp_f + '°F / ' + data.city2.temp_c + '°C';
                    document.getElementById('weatherDesc2').textContent = data.city2.description;
                });
        }

        function convertCurrency() {
            fetch('/convert_currency', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ city1: city1Select.value, city2: city2Select.value, amount: document.getElementById('amount').value })
            })
                .then(response => response.json())
                .then(data => {
                    if (data.error) { alert(data.error); return; }
                    const symbols = { 'USD': '$', 'EUR': '€', 'GBP': '£', 'JPY': '¥', 'AUD': 'A$', 'CAD': 'C$', 'MXN': 'Mex$', 'BRL': 'R$', 'INR': '₹', 'SGD': 'S$', 'HKD': 'HK$', 'AED': 'د.إ' };
                    document.getElementById('convertedAmount').textContent = (symbols[data.to_currency] || data.to_currency) + data.converted.toLocaleString();
                    document.getElementById('exchangeRate').textContent = '1 ' + data.from_currency + ' = ' + data.rate + ' ' + data.to_currency;
                    document.getElementById('fromCurrency').textContent = data.from_currency;
                    document.getElementById('toCurrency').textContent = data.to_currency;
                    document.getElementById('result').classList.add('show');
                });
        }

        city1Select.addEventListener('change', () => {
            updateTimes();
            updateWeather();
            document.getElementById('result').classList.remove('show');
        });
        city2Select.addEventListener('change', () => {
            updateTimes();
            updateWeather();
            document.getElementById('result').classList.remove('show');
        });

        updateTimes();
        updateWeather();
        setInterval(updateTimes, 1000);
        document.getElementById('yonderHero').innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 380 200" role="img" aria-label="Yonder — time to travel"><title>Yonder animated logo</title><desc>Planes glide out and back over a ten-second loop, each leaving a gold gradient contrail that dissolves.</desc><style>.gold{fill:#C9A84C;}.ln{stroke-width:1.6;fill:none;stroke-linecap:round;stroke-dasharray:240;}.rg{stroke:#C9A84C;stroke-width:2.2;fill:none;}.wm{font-family:'Syne','Trebuchet MS',sans-serif;font-weight:800;fill:#C9A84C;}.tag{font-family:'Cormorant Garamond',Georgia,serif;font-style:italic;fill:#C9A84C;}.pTopL,.pBotR{opacity:0;}.tTopO{animation:rTopO 10s ease-in-out infinite; stroke:url(#trailOutTop);}.tTopB{animation:rTopB 10s ease-in-out infinite; stroke:url(#trailBackTop);}.tBotO{animation:rBotO 10s ease-in-out infinite; stroke:url(#trailOutBot);}.tBotB{animation:rBotB 10s ease-in-out infinite; stroke:url(#trailBackBot);}.pTopR{animation:flyOutTop 10s ease-in-out infinite;}.pTopL{animation:flyBackTop 10s ease-in-out infinite;}.pBotL{animation:flyOutBot 10s ease-in-out infinite;}.pBotR{animation:flyBackBot 10s ease-in-out infinite;}@keyframes rTopO{0%{stroke-dashoffset:240;opacity:0}5%{opacity:1}42%{stroke-dashoffset:0;opacity:1}50%{stroke-dashoffset:0;opacity:0}100%{stroke-dashoffset:0;opacity:0}}@keyframes rTopB{0%,50%{stroke-dashoffset:-240;opacity:0}55%{opacity:1}92%{stroke-dashoffset:0;opacity:1}100%{stroke-dashoffset:0;opacity:0}}@keyframes rBotO{0%{stroke-dashoffset:-240;opacity:0}5%{opacity:1}42%{stroke-dashoffset:0;opacity:1}50%{stroke-dashoffset:0;opacity:0}100%{stroke-dashoffset:0;opacity:0}}@keyframes rBotB{0%,50%{stroke-dashoffset:240;opacity:0}55%{opacity:1}92%{stroke-dashoffset:0;opacity:1}100%{stroke-dashoffset:0;opacity:0}}@keyframes flyOutTop{0%{transform:translate(70px,45px);opacity:0}5%{opacity:1}42%{transform:translate(310px,45px);opacity:1}46%{transform:translate(310px,45px);opacity:0}100%{transform:translate(310px,45px);opacity:0}}@keyframes flyBackTop{0%,50%{transform:translate(310px,45px);opacity:0}54%{opacity:1}92%{transform:translate(70px,45px);opacity:1}96%,100%{transform:translate(70px,45px);opacity:0}}@keyframes flyOutBot{0%{transform:translate(310px,155px);opacity:0}5%{opacity:1}42%{transform:translate(70px,155px);opacity:1}46%{transform:translate(70px,155px);opacity:0}100%{transform:translate(70px,155px);opacity:0}}@keyframes flyBackBot{0%,50%{transform:translate(70px,155px);opacity:0}54%{opacity:1}92%{transform:translate(310px,155px);opacity:1}96%,100%{transform:translate(310px,155px);opacity:0}}</style><defs><linearGradient id="trailOutTop" x1="70" y1="45" x2="310" y2="45" gradientUnits="userSpaceOnUse"><stop offset="0%" stop-color="#C9A84C" stop-opacity="0"/><stop offset="55%" stop-color="#C9A84C" stop-opacity="0.55"/><stop offset="100%" stop-color="#E8C97A" stop-opacity="1"/></linearGradient><linearGradient id="trailBackTop" x1="70" y1="45" x2="310" y2="45" gradientUnits="userSpaceOnUse"><stop offset="0%" stop-color="#E8C97A" stop-opacity="1"/><stop offset="45%" stop-color="#C9A84C" stop-opacity="0.55"/><stop offset="100%" stop-color="#C9A84C" stop-opacity="0"/></linearGradient><linearGradient id="trailOutBot" x1="70" y1="155" x2="310" y2="155" gradientUnits="userSpaceOnUse"><stop offset="0%" stop-color="#E8C97A" stop-opacity="1"/><stop offset="45%" stop-color="#C9A84C" stop-opacity="0.55"/><stop offset="100%" stop-color="#C9A84C" stop-opacity="0"/></linearGradient><linearGradient id="trailBackBot" x1="70" y1="155" x2="310" y2="155" gradientUnits="userSpaceOnUse"><stop offset="0%" stop-color="#C9A84C" stop-opacity="0"/><stop offset="55%" stop-color="#C9A84C" stop-opacity="0.55"/><stop offset="100%" stop-color="#E8C97A" stop-opacity="1"/></linearGradient></defs><line class="ln tTopO" x1="70" y1="45" x2="310" y2="45"/><line class="ln tTopB" x1="70" y1="45" x2="310" y2="45"/><g class="pTopR"><g transform="rotate(90) scale(0.55)"><polygon class="gold" points="0,-12 2.5,-3 12,2 2.5,3.5 2.5,8 6.5,11.5 1.6,11 0,13 -1.6,11 -6.5,11.5 -2.5,8 -2.5,3.5 -12,2 -2.5,-3"/></g></g><g class="pTopL"><g transform="rotate(270) scale(0.55)"><polygon class="gold" points="0,-12 2.5,-3 12,2 2.5,3.5 2.5,8 6.5,11.5 1.6,11 0,13 -1.6,11 -6.5,11.5 -2.5,8 -2.5,3.5 -12,2 -2.5,-3"/></g></g><circle class="rg" cx="95" cy="105" r="20"/><polygon class="gold" points="95,91 98.5,101.5 109,105 98.5,108.5 95,119 91.5,108.5 81,105 91.5,101.5"/><text class="wm" x="123" y="115" font-size="30" letter-spacing="0.5">Yonder</text><text class="tag" x="230" y="138" font-size="15" text-anchor="middle">Time to travel</text><line class="ln tBotO" x1="70" y1="155" x2="310" y2="155"/><line class="ln tBotB" x1="70" y1="155" x2="310" y2="155"/><g class="pBotL"><g transform="rotate(270) scale(0.55)"><polygon class="gold" points="0,-12 2.5,-3 12,2 2.5,3.5 2.5,8 6.5,11.5 1.6,11 0,13 -1.6,11 -6.5,11.5 -2.5,8 -2.5,3.5 -12,2 -2.5,-3"/></g></g><g class="pBotR"><g transform="rotate(90) scale(0.55)"><polygon class="gold" points="0,-12 2.5,-3 12,2 2.5,3.5 2.5,8 6.5,11.5 1.6,11 0,13 -1.6,11 -6.5,11.5 -2.5,8 -2.5,3.5 -12,2 -2.5,-3"/></g></g></svg>`;
        setInterval(updateWeather, 300000); // Update weather every 5 minutes
    </script>
</body>

</html>
